name: Validate MCP-Go 1061 native gates

on:
  push:
    branches: [validation/mcp-go1061-native-gates-final-20261011]
    paths: [.github/workflows/validate-1061-native.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rudycelekli/mcp-go
          ref: 85c38376e7e843d9cee12d993b05768607a19a3c
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Record exact public source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85c38376e7e843d9cee12d993b05768607a19a3c
          mkdir -p "$RUNNER_TEMP/validation-proof"
          { git rev-parse HEAD; go version; uname -a; } > "$RUNNER_TEMP/validation-proof/runtime.txt"
      - name: Root race suite
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -race 2>&1 | tee "$RUNNER_TEMP/validation-proof/root-race.log"
      - name: OpenTelemetry race suite
        working-directory: otel
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -race 2>&1 | tee "$RUNNER_TEMP/validation-proof/otel-race.log"
      - name: Verify clean code generation
        shell: bash
        run: |
          set -euo pipefail
          go generate ./... 2>&1 | tee "$RUNNER_TEMP/validation-proof/codegen.log"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Root lint at upstream version
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.8
          working-directory: .
      - name: OpenTelemetry lint at upstream version
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.8
          working-directory: otel
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: mcp-go-1061-native-gates-proof
          path: ${{ runner.temp }}/validation-proof/
          if-no-files-found: error
          retention-days: 7

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rudycelekli/mcp-go
          ref: 85c38376e7e843d9cee12d993b05768607a19a3c
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.3
      - name: Test current conformance checker and native loopback server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 85c38376e7e843d9cee12d993b05768607a19a3c
          mkdir -p "$RUNNER_TEMP/conformance-proof"
          { git rev-parse HEAD; go version; node --version; uname -a; } > "$RUNNER_TEMP/conformance-proof/runtime.txt"
          python3 -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/conformance-proof/checker.log"
          go run ./examples/conformance > "$RUNNER_TEMP/conformance-proof/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat "$RUNNER_TEMP/conformance-proof/server.log"
              exit 1
            fi
            sleep 1
          done
          python3 scripts/check_conformance.py --url http://127.0.0.1:3000/mcp --baseline conformance/server/expected-failures.yml 2>&1 | tee "$RUNNER_TEMP/conformance-proof/result.log"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: mcp-go-1061-conformance-proof
          path: ${{ runner.temp }}/conformance-proof/
          if-no-files-found: error
          retention-days: 7
